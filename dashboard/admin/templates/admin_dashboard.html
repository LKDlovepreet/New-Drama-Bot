<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="/static/admin/admin_style.css">
    <script>
        async function loadData(page) {
            const res = await fetch('/api/' + page);
            document.getElementById('main-content').innerHTML = await res.text();
        }
    </script>
</head>
<body onload="loadData('status')">
    <div class="sidebar">
        <button onclick="loadData('status')">Status</button>
        <button onclick="loadData('users')">Users</button>
        <form action="/logout" method="post"><button type="submit">Logout</button></form>
    </div>
    <div id="main-content" class="content"></div>
</body>
</html>
