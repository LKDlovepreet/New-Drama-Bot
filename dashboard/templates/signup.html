<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RAMGARHIA Services</title>
    <link rel="stylesheet" href="/static/style.css?v=6.0">
    <style>
        .signup-container { max-width: 500px; margin: 40px auto; }
        .form-section { text-align: left; margin-bottom: 20px; background: var(--bg-panel); padding: 25px; border-radius: 12px; border: 1px solid var(--border); }
        .form-section h3 { font-size: 16px; color: var(--bg-header); margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
        .file-upload-wrapper { border: 2px dashed var(--border); padding: 20px; text-align: center; border-radius: 8px; background: var(--bg-main); margin-bottom: 15px; }
        .file-upload-wrapper input[type="file"] { width: 100%; cursor: pointer; }
    </style>
</head>
<body class="auth-body" style="align-items: flex-start;">
    <div class="auth-container signup-container">
        <div class="auth-box" style="padding: 20px;">
            <div class="auth-header">
                <h2 style="color: var(--bg-header);">Create Account</h2>
                <p>Join RAMGARHIA Services</p>
            </div>

            <form action="/signup" method="post" id="signup-form" enctype="multipart/form-data">
                
                <div class="form-section">
                    <h3>📸 Profile Picture (Optional)</h3>
                    <div class="file-upload-wrapper">
                        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">Select a photo from your gallery</p>
                        <input type="file" name="profile_pic" accept="image/*">
                    </div>
                </div>

                <div class="form-section">
                    <h3>🔴 Mandatory Information</h3>
                    <div class="input-group">
                        <input type="text" name="full_name" placeholder="Full Name" required>
                        <input type="date" name="dob" title="Date of Birth" required style="color: var(--text-muted);">
                        <input type="number" name="telegram_id" placeholder="Numeric Telegram ID (eg: 12345678)" required>
                        <input type="password" name="passkey" id="passkey" placeholder="Create Secure Password" required minlength="8">
                    </div>
                </div>

                <div class="form-section">
                    <h3>🟢 Optional Information</h3>
                    <div class="input-group">
                        <input type="email" name="email" placeholder="Email Address">
                        <input type="tel" name="mobile_number" placeholder="Mobile Number">
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="padding: 15px; font-size: 16px;">Sign Up & Get OTP 🚀</button>
            </form>
            <a href="/login" class="back-link">Already have an account? Login here</a>
        </div>
    </div>
</body>
</html>
