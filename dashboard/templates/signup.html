<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RAMGARHIA Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=8.0">
    <style>
        .signup-container { max-width: 500px; margin: 40px auto; }
        .step { display: none; animation: fadeIn 0.4s ease-in-out; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .progress-container { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; }
        .progress-container::before { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: var(--border); z-index: 1; }
        .step-circle { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-main); border: 2px solid var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 2; position: relative; transition: 0.3s; }
        .step-circle.active { background: var(--bg-header); border-color: var(--bg-header); color: white; }
        .step-circle.completed { background: var(--success); border-color: var(--success); color: white; }

        .form-section { text-align: left; margin-bottom: 20px; }
        .form-section h3 { font-size: 16px; color: var(--bg-header); margin-bottom: 15px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-secondary { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border); padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; flex: 1; }
        .btn-primary { flex: 2; }
        
        /* Custom File Input Design */
        .custom-file-upload { border: 2px dashed var(--border); padding: 20px; text-align: center; border-radius: 8px; background: var(--bg-main); cursor: pointer; display: block; margin-bottom: 10px; }
        .custom-file-upload:hover { border-color: var(--success); }
        input[type="file"] { display: none; }
    </style>
    <script>
        function nextStep(step) {
            if (step === 2) {
                if (!document.getElementById('signup-form').checkValidity()) {
                    document.getElementById('signup-form').reportValidity();
                    return;
                }
            }
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            document.querySelectorAll('.step-circle').forEach((el, index) => {
                if (index < step - 1) el.classList.add('completed', 'active');
                else if (index === step - 1) el.classList.add('active');
                else el.classList.remove('active', 'completed');
            });
        }

        function prevStep(step) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
        }

        document.addEventListener("DOMContentLoaded", function() {
            // Picture Preview Logic
            document.getElementById("profile_pic").addEventListener("change", function() {
                if(this.files && this.files[0]) {
                    let img = document.getElementById('custom-avatar-img');
                    img.src = URL.createObjectURL(this.files[0]);
                    img.style.display = 'block';
                }
            });

            // Form Submit Logic (FormData ke sath File bhejenge)
            document.getElementById("signup-form").addEventListener("submit", async function(e) {
                e.preventDefault();
                const formData = new FormData(this); // Isse file aaram se backend me jayegi
                
                const submitBtn = document.getElementById('submit-btn');
                submitBtn.innerText = "Uploading & Saving...";
                submitBtn.disabled = true;

                try {
                    const res = await fetch('/signup', {
                        method: 'POST',
                        body: formData // JSON ki jagah direct FormData bhej rahe hain
                    });
                    const result = await res.json();
                    
                    if(result.success) {
                        window.location.href = result.redirect; // Verify page par redirect
                    } else {
                        alert("Error: " + result.message);
                        submitBtn.innerText = "Submit & Verify 🚀";
                        submitBtn.disabled = false;
                    }
                } catch(error) {
                    alert("Network error.");
                    submitBtn.innerText = "Submit & Verify 🚀";
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</head>
<body class="auth-body" style="align-items: flex-start;">
    <div class="auth-container signup-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2 style="font-family: 'Newsreader', serif; color: var(--bg-header);">Create Account</h2>
                <p>Join RAMGARHIA Services</p>
            </div>

            <div class="progress-container">
                <div class="step-circle active">1</div><div class="step-circle">2</div><div class="step-circle">3</div>
            </div>

            <form id="signup-form" enctype="multipart/form-data">
                
                <div class="step active" id="step1">
                    <div class="form-section">
                        <h3>🔴 Mandatory Information</h3>
                        <div class="input-group">
                            <input type="text" name="full_name" placeholder="Full Name" required>
                            <label style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 5px; font-weight: 500;">Date of Birth</label>
                            <input type="date" name="dob" required style="color: var(--text-main);">
                            <input type="number" name="telegram_id" placeholder="Numeric Telegram ID" required>
                            <input type="password" name="passkey" placeholder="Secure Password" required minlength="8">
                        </div>
                    </div>
                    <button type="button" class="btn-primary" onclick="nextStep(2)">Next Step ➡️</button>
                    <a href="/login" class="back-link" style="display: block; text-align: center; margin-top: 15px;">Already have an account? Login here</a>
                </div>

                <div class="step" id="step2">
                    <div class="form-section">
                        <h3>🟢 Optional Information</h3>
                        <div class="input-group">
                            <input type="email" name="email" placeholder="Email Address (Optional)">
                            <input type="tel" name="mobile_number" placeholder="Mobile Number (Optional)">
                        </div>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn-secondary" onclick="prevStep(1)">⬅️ Back</button>
                        <button type="button" class="btn-primary" onclick="nextStep(3)">Next Step ➡️</button>
                    </div>
                </div>

                <div class="step" id="step3">
                    <div class="form-section" style="text-align: center;">
                        <h3>📸 Profile Picture (Optional)</h3>
                        <img src="" id="custom-avatar-img" style="display: none; width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin: 15px auto; border: 3px solid var(--success);">
                        
                        <label class="custom-file-upload">
                            <input type="file" name="profile_pic" id="profile_pic" accept="image/*">
                            🖼️ Tap to Select from Gallery
                        </label>
                    </div>
                    
                    <div class="btn-group">
                        <button type="button" class="btn-secondary" onclick="prevStep(2)">⬅️ Back</button>
                        <button type="submit" class="btn-success" id="submit-btn" style="flex: 2; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; color: white;">Submit & Verify 🚀</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
