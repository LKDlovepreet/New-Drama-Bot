<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RAMGARHIA Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=4.0">
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    
    <style>
        .signup-container { max-width: 600px; margin: 40px auto; }
        .form-section { text-align: left; margin-bottom: 20px; }
        .form-section h3 { font-size: 14px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        
        /* Profile Selection UI */
        .avatar-selection { display: flex; gap: 15px; align-items: center; justify-content: center; margin-bottom: 20px; }
        .avatar-option { width: 60px; height: 60px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: 0.3s; object-fit: cover; }
        .avatar-option.selected { border-color: var(--success); transform: scale(1.1); box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .upload-btn { background: var(--bg-header); color: white; padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
    </style>

    <script>
        // Cloudinary Upload Logic
        var myWidget = cloudinary.createUploadWidget({
            cloudName: 'dordvtopl', // Yahan apna Cloud Name dalein
            uploadPreset: 'Profile pictures', // Yahan Unsigned Upload Preset dalein
            folder: 'profile',
            cropping: true, // Photo Crop karne ka option
            multiple: false
        }, (error, result) => { 
            if (!error && result && result.event === "success") { 
                setProfilePic(result.info.secure_url, 'custom-avatar');
            }
        });

        function openCloudinary() { myWidget.open(); }

        function setProfilePic(url, elementId) {
            document.getElementById('profile_pic_url').value = url;
            document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
            if(elementId) {
                let customImg = document.getElementById(elementId);
                customImg.src = url;
                customImg.style.display = 'block';
                customImg.classList.add('selected');
            }
        }

        // Super Secure Password Validation
        function validateSignup() {
            var pw = document.getElementById("passkey").value;
            // Kam se kam 8 letters, 1 uppercase, 1 lowercase, 1 number, 1 special character
            var pattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            
            if(!pattern.test(pw)) {
                alert("Password MUST be at least 8 characters long, include 1 Capital letter, 1 Number, and 1 Special Character (@$!%*?&).");
                return false;
            }
            return true;
        }
    </script>
</head>
<body class="auth-body" style="align-items: flex-start;">
    <div class="auth-container signup-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2 style="font-family: 'Newsreader', serif; color: var(--bg-header);">Create Account</h2>
                <p>Join RAMGARHIA Services</p>
            </div>

            <form action="/signup" method="post" onsubmit="return validateSignup()">
                
                <div class="form-section" style="text-align: center;">
                    <h3>Choose Profile Picture</h3>
                    <div class="avatar-selection">
                        <img src="https://i.pinimg.com/736x/8f/33/2d/8f332dd34b6e5114705bd364741db457.jpg" id="oggy-avatar" class="avatar-option selected" onclick="setProfilePic(this.src, 'oggy-avatar')">
                        <img src="https://i.pinimg.com/736x/b2/84/c4/b284c4ee141d5bfcb8680388d0115e58.jpg" id="jack-avatar" class="avatar-option" onclick="setProfilePic(this.src, 'jack-avatar')">
                        <img src="" id="custom-avatar" class="avatar-option" style="display: none;" onclick="setProfilePic(this.src, 'custom-avatar')">
                        
                        <button type="button" class="upload-btn" onclick="openCloudinary()">📸 Upload Image</button>
                    </div>
                    <input type="hidden" name="profile_pic_url" id="profile_pic_url" value="https://i.pinimg.com/736x/8f/33/2d/8f332dd34b6e5114705bd364741db457.jpg">
                </div>

                <div class="form-section">
                    <h3>🔴 Mandatory Information</h3>
                    <div class="input-group">
                        <input type="text" name="full_name" placeholder="Full Name" required>
                        <input type="date" name="dob" title="Date of Birth" required style="color: var(--text-muted);">
                        <input type="text" name="telegram_id" placeholder="Telegram Username OR User ID" required>
                        <input type="password" name="passkey" id="passkey" placeholder="Super Secure Password" required>
                        <p style="font-size: 11px; color: var(--text-muted); margin-top: -15px; margin-bottom: 15px;">Min 8 chars, 1 Capital, 1 Number, 1 Symbol (@$!%*?&)</p>
                    </div>
                </div>

                <div class="form-section">
                    <h3>🟢 Optional Information</h3>
                    <div class="input-group">
                        <input type="email" name="email" placeholder="Email Address (Optional)">
                        <input type="tel" name="mobile_number" placeholder="Mobile Number (Optional)">
                    </div>
                </div>

                <button type="submit" class="btn-primary">Create Account & Verify ➡️</button>
            </form>
            
            <a href="/login" class="back-link">Already have an account? Login here</a>
        </div>
    </div>
</body>
</html>
