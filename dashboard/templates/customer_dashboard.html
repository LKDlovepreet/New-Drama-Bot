<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal - RAMGARHIA Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=8.0">
    <script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
    }
    async function loadData(page) {
        document.getElementById('main-content').innerHTML = '<div style="padding: 20px; color: var(--text-muted);">Loading Data...</div>';
        document.querySelectorAll('.sidebar-nav button').forEach(b => b.classList.remove('active'));
        if(document.getElementById('btn-'+page)) document.getElementById('btn-'+page).classList.add('active');
        if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('active');

        try {
            const res = await fetch('/api/' + page);
            const html = await res.text();
            document.getElementById('main-content').innerHTML = html;
        } catch(e) { document.getElementById('main-content').innerHTML = '<p class="error-msg">Failed to load data.</p>'; }
    }
    </script>
</head>
<body onload="loadData('store')">
    <header class="top-navbar">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        </div>
        <div class="logo">
            <h2 style="font-family: 'Newsreader', serif; margin: 0; color: var(--text-light);">RAMGARHIA Services</h2>
        </div>
        <div class="profile-section" style="cursor: pointer;" onclick="loadData('profile')" title="My Profile">
            <img src="{profile_pic}" alt="Profile" class="profile-pic" onerror="this.src='https://ui-avatars.com/api/?name=Customer&background=555&color=fff'">
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav">
                <button id="btn-store" onclick="loadData('store')">🛍️ Bot Store</button>
                <button id="btn-profile" onclick="loadData('profile')">👤 My Profile</button>
            </nav>
            <div class="sidebar-footer">
                <form action="/logout" method="post"><button class="logout-btn" type="submit">🚪 Logout</button></form>
            </div>
        </aside>
        <main class="content" id="main-content" style="padding: 30px;"></main>
    </div>
</body>
</html>
