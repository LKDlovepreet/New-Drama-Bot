<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA - RAMGARHIA Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=3.0">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2 style="color: var(--bg-header);">📲 Two-Step Verification</h2>
                <p>OTP sent to Owner's Telegram</p>
            </div>
            <form action="/verify" method="post">
                <div class="input-group">
                    <input type="text" name="otp" placeholder="123456" required maxlength="6" autocomplete="off" style="text-align: center; letter-spacing: 5px; font-size: 20px;">
                </div>
                <button type="submit" class="btn-success">Verify & Enter 🔓</button>
            </form>
            <p class="error-msg">{error}</p>
        </div>
    </div>
</body>
</html>
