<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
    async function loadData(page) {
        document.getElementById('main-view').innerHTML = '<div class="loader">Loading Data...</div>';
        document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+page).classList.add('active');

        try {
            const res = await fetch('/api/' + page);
            const html = await res.text();
            document.getElementById('main-view').innerHTML = html;
        } catch(e) {
            document.getElementById('main-view').innerHTML = '<p class="error-msg">Failed to load data.</p>';
        }
    }
    </script>
</head>
<body class="dashboard-body" onload="loadData('status')">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>🤖 Guard Panel</h2>
            <p>System v2.0</p>
        </div>
        <nav class="sidebar-nav">
            <button id="btn-status" onclick="loadData('status')">📊 Status & Traffic</button>
            <button id="btn-users" onclick="loadData('users')">👥 User Directory</button>
            <button id="btn-files" onclick="loadData('files')">📂 File Storage</button>
            <button id="btn-admins" onclick="loadData('admins')">👮 Admin Controls</button>
        </nav>
        <div class="sidebar-footer">
            <form action="/logout" method="post">
                <button class="logout-btn" type="submit">🚪 Logout</button>
            </form>
        </div>
    </aside>
    <main class="content" id="main-view">
        </main>
</body>
</html>
