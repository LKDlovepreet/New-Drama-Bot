<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMGARHIA Services - Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    
    <script>
    // RGThinks jaisa Sidebar Toggle Function
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('active');
    }

    async function loadData(page) {
        document.getElementById('main-content').innerHTML = '<div class="loader">Loading Data...</div>';
        document.querySelectorAll('.sidebar-nav button').forEach(b => b.classList.remove('active'));
        if(document.getElementById('btn-'+page)) {
            document.getElementById('btn-'+page).classList.add('active');
        }
        
        // Mobile me click karne par sidebar band ho jaye
        if(window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.remove('active');
        }

        try {
            const res = await fetch('/api/' + page);
            const html = await res.text();
            document.getElementById('main-content').innerHTML = html;
        } catch(e) {
            document.getElementById('main-content').innerHTML = '<p class="error-msg">Failed to load data.</p>';
        }
    }
    </script>
</head>
<body onload="loadData('status')">
    
    <header class="top-navbar">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        </div>
        <div class="logo">
            <h2>RAMGARHIA Services</h2>
        </div>
        <div class="profile-section">
            <img src="/static/profile.jpg" alt="Profile" class="profile-pic" onerror="this.src='https://ui-avatars.com/api/?name=Owner&background=555&color=fff'">
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav">
                <button id="btn-status" onclick="loadData('status')">📊 Dashboard Menu</button>
                <button id="btn-users" onclick="loadData('users')">👥 Manage Users</button>
                <button id="btn-files" onclick="loadData('files')">📂 Manage Files</button>
                <button id="btn-admins" onclick="loadData('admins')">👮 Manage Admins</button>
            </nav>
            <div class="sidebar-footer">
                <form action="/logout" method="post">
                    <button class="logout-btn" type="submit">🚪 Logout</button>
                </form>
            </div>
        </aside>

        <main class="content" id="main-content">
            </main>
    </div>

</body>
</html>
