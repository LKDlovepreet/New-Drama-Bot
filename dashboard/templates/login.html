<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Login - Guard Bot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>🛡️ Owner Access</h2>
                <p>Secure System Panel</p>
            </div>
            <form action="/login" method="post">
                <div class="input-group">
                    <input type="password" name="passkey" placeholder="Enter Master Password" required>
                </div>
                <button type="submit" class="btn-primary">Proceed Securely ➡️</button>
            </form>
            <p class="error-msg">{error}</p>
        </div>
    </div>
</body>
</html>
