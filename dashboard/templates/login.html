<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RAMGARHIA Services</title>
    <link rel="stylesheet" href="/static/style.css?v=5.0">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-box">
            <h2 style="font-family: 'Newsreader', serif;">Welcome Back</h2>
            <p style="color:var(--text-muted); margin-bottom:25px;">Login to your account</p>
            
            <form action="/login" method="post">
                <div class="input-group">
                    <input type="text" name="login_id" placeholder="Telegram ID or Username" required>
                    <input type="password" name="passkey" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary">Login ➡️</button>
            </form>
            <p class="error-msg">{error}</p>
            <p style="font-size:14px; margin-top:15px;">New here? <a href="/signup" style="color:var(--bg-header);">Create an account</a></p>
        </div>
    </div>
</body>
</html>
