<!DOCTYPE html>
<html>
<head>
    <title>User Portal</title>
    <link rel="stylesheet" href="/static/user_style.css">
    <script>
        async function loadData(page) {
            const res = await fetch('/api/' + page);
            document.getElementById('main-content').innerHTML = await res.text();
        }
    </script>
</head>
<body onload="loadData('store')">
    <div class="header">
        <img src="{profile_pic}" onclick="loadData('profile')" style="width:40px; border-radius:50%; cursor:pointer;">
        <span>RAMGARHIA Services</span>
    </div>
    <div class="sidebar">
        <button onclick="loadData('store')">Store</button>
        <button onclick="loadData('profile')">Profile</button>
    </div>
    <div id="main-content"></div>
</body>
</html>
